
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resolvelo — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #111;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    text-align: center;
    padding: 40px 20px 30px;
  }

  header h1 {
    font-weight: 300;
    letter-spacing: 6px;
    font-size: 1.6rem;
    color: #fff;
    text-transform: uppercase;
  }

  main {
    flex: 1;
    padding: 10px 20px 40px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }

  .card {
    display: block;
    text-decoration: none;
    color: #fff;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.25s ease, filter 0.25s ease;
    border: 1px solid #2c2c2c;
  }

  .card:hover {
    transform: scale(1.02);
    filter: brightness(1.12);
  }

  .card img {
    width: 100%;
    display: block;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 8px 8px 0 0;
  }

  .card h2 {
    font-weight: 400;
    font-size: 1rem;
    padding: 16px 18px 20px;
    text-align: center;
    letter-spacing: 0.3px;
    line-height: 1.4;
  }

  footer {
    text-align: center;
    padding: 24px 20px;
    font-size: 0.75rem;
    color: #777;
    letter-spacing: 0.5px;
  }

  @media (min-width: 700px) {
    .grid {
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }
    header h1 {
      font-size: 2rem;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Resolvelo</h1>
</header>

<main>
  <div class="grid">

    <a class="card" href="https://payhip.com/b/uo6I8" target="_blank" rel="noopener">
      <img src="tapa-reposteria.webp" alt="Repostería Rentable 360">
      <h2>Repostería Rentable 360</h2>
    </a>

    <a class="card" href="https://payhip.com/b/bsODQ" target="_blank" rel="noopener">
      <img src="tapa-plata.webp" alt="Trabajo todo el mes... ¿y siempre llego justa?">
      <h2>Trabajo todo el mes... ¿y siempre llego justa?</h2>
    </a>

    <a class="card" href="https://payhip.com/b/UqsXi" target="_blank" rel="noopener">
      <img src="tapa-porquehaceeso.webp" alt="Por qué hace eso.">
      <h2>Por qué hace eso.</h2>
    </a>

    <a class="card" href="https://payhip.com/b/wq5qb" target="_blank" rel="noopener">
      <img src="tapa-21k.webp" alt="21K Sin la Pared">
      <h2>21K Sin la Pared</h2>
    </a>

  </div>
</main>

<footer>
  © 2026 Resolvelo — Todos los derechos reservados
</footer>

</body>
</html>
